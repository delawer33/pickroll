name: Answer eval

# Eval ответов на герметичном Eval-срезе. ТОЛЬКО ручной запуск: прогон ходит в платный
# LLM-шлюз (агент + судья + эмбеддинги запросов), поэтому на PR и push его нет. Автоматический
# гейт — спринт 5. Нужные секреты и переменные — в README, «Eval ответов → CI».

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Только эти категории вопросов (через запятую), пусто — весь набор"
        required: false
        default: ""
      question_id:
        description: "Только эти id вопросов (через запятую), пусто — без фильтра"
        required: false
        default: ""
      slice_release_tag:
        description: "Тег релиза с eval-slice.tar.gz, если срез не умещается в git; пусто — срез из чекаута"
        required: false
        default: ""
      concurrency:
        description: "Сколько вопросов одновременно (лимиты шлюза: больше 2 ловит 429)"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: answer-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        # Тот же образ, что в docker-compose и в тестах: миграция ставит расширение vector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: court_vision
          POSTGRES_PASSWORD: court_vision
          POSTGRES_DB: court_vision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U court_vision -d court_vision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Пароль сервисной базы живёт только внутри джобы — это не секрет.
      DATABASE_URL: postgresql+asyncpg://court_vision:court_vision@localhost:5432/court_vision
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
      RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      # Имена моделей — переменные репозитория, а не секреты. Пустое значение в env
      # перекрыло бы дефолт настроек пустой строкой, поэтому дефолт продублирован здесь.
      LLM_MODEL: ${{ vars.LLM_MODEL || 'anthropic/claude-haiku-4-5' }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'anthropic/claude-sonnet-4-5' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'openai/google/gemini-embedding-001' }}
      REPORT_DIR: ${{ github.workspace }}/eval-reports
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Срез сверх бюджета git (15 МБ) лежит asset'ом `eval-slice.tar.gz` релиза: тег
      # указывается в форме запуска и перекрывает каталог среза из чекаута.
      - name: Срез из GitHub Release
        if: inputs.slice_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SLICE_RELEASE_TAG: ${{ inputs.slice_release_tag }}
        run: |
          mkdir -p evals/slice
          gh release download "$SLICE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern eval-slice.tar.gz --output - | tar -xz -C evals/slice
      - name: Eval ответов на Eval-срезе
        env:
          # Входы — через env, а не подстановкой в скрипт: значение из формы запуска не
          # должно попадать в текст команды.
          CATEGORY: ${{ inputs.category }}
          QUESTION_ID: ${{ inputs.question_id }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          args=(--slice --report-dir "$REPORT_DIR" --concurrency "$CONCURRENCY")
          IFS=',' read -ra categories <<< "$CATEGORY"
          for item in "${categories[@]}"; do args+=(--category "${item// /}"); done
          IFS=',' read -ra ids <<< "$QUESTION_ID"
          for item in "${ids[@]}"; do args+=(--id "${item// /}"); done
          uv run python -m court_vision.answer_eval "${args[@]}"
      # Отчёт нужен и когда прогон «провалился» (код выхода 1 — ниже порогов): ради него
      # прогон и запускали.
      - name: Отчёт в summary джобы
        if: always()
        run: |
          shopt -s nullglob
          for report in "$REPORT_DIR"/*.md; do cat "$report" >> "$GITHUB_STEP_SUMMARY"; done
      - name: Отчёт артефактом
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: answer-eval-report
          path: eval-reports/
          if-no-files-found: warn
