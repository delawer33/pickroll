name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            images:
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: pytest
        run: uv run pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Версия pnpm берётся из поля packageManager — задавать её здесь вторично значит
      # получить ERR_PNPM_BAD_PM_VERSION. Путь указывать обязательно: `working-directory`
      # на шаги `uses` не распространяется, и без него экшен ищет package.json в корне
      # репозитория, где его нет, — «No pnpm version is specified».
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint
      - name: tsc --noEmit
        run: pnpm typecheck
      - name: vitest
        run: pnpm test

  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Проверки выше гоняют тулинг на хосте, поэтому поломка Dockerfile или compose
      # без этой джобы всплыла бы только у того, кто первым поднимет систему.
      # Именно копия, а не `--env-file .env.example`: тот подменяет только источник
      # подстановки переменных, а `env_file: .env` внутри сервисов остаётся и падает на
      # отсутствующем файле. Копия повторяет первый шаг README — так же начинает и человек.
      - name: .env из примера
        run: cp .env.example .env
      - name: docker compose config
        run: docker compose config -q
      - name: docker compose build
        run: docker compose build
