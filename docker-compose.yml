services:
  api:
    container_name: court_vision_api
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT_INTERNAL}/${POSTGRES_DB}
      REDIS_URL: redis://cache:${REDIS_PORT_INTERNAL}/0
    ports:
      - "${API_PORT_EXTERNAL}:${API_PORT_INTERNAL}"
    volumes:
      # Кеш скачанного датасета переживает пересоздание контейнера: иначе каждый
      # `compose up --build` заставляет seed качать гигабайты заново.
      - dataset_cache:/app/data
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${API_PORT_INTERNAL}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    container_name: court_vision_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
      FRONTEND_PORT_INTERNAL: ${FRONTEND_PORT_INTERNAL}
    ports:
      - "${FRONTEND_PORT_EXTERNAL}:${FRONTEND_PORT_INTERNAL}"
    volumes:
      # Исходники смонтированы ради HMR; node_modules остаются образными.
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - app_network

  db:
    container_name: court_vision_db
    image: pgvector/pgvector:pg17
    env_file:
      - .env
    ports:
      # Только на loopback: БД с дефолтным паролем не должна торчать в локальную сеть.
      - "127.0.0.1:${POSTGRES_PORT_EXTERNAL}:${POSTGRES_PORT_INTERNAL}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cache:
    container_name: court_vision_cache
    image: redis:7-alpine
    ports:
      # Redis без аутентификации — тем более только на loopback.
      - "127.0.0.1:${REDIS_PORT_EXTERNAL}:${REDIS_PORT_INTERNAL}"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  dataset_cache:

networks:
  app_network:
    driver: bridge
