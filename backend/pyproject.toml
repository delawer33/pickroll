[project]
name = "court-vision"
version = "0.1.0"
description = "Court Vision — AI-ассистент баскетбольного скаута"
requires-python = ">=3.13"
dependencies = [
    # 0.141 — граница по родному SSE (`fastapi.sse`): кодирование фреймов, keepalive и
    # описание потока в OpenAPI берутся из фреймворка, а не пишутся руками.
    "fastapi>=0.141",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "greenlet>=3.5.5",
    "pyjwt[crypto]>=2.10",
    "litellm>=1.63",
    # Трейсы уходят колбэком litellm `langfuse_otel` — по OTLP, мимо самого SDK. Пакет всё
    # равно в зависимостях: он приносит opentelemetry-экспортёр, которым этот колбэк и
    # пишет (у litellm otel лежит в extra `proxy-runtime`). Включается только при
    # заданных ключах — см. `observability.py`.
    "langfuse>=4",
    "sse-starlette>=2.1",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "pre-commit>=4.0",
    "asyncpg-stubs>=0.31.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/court_vision"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]
# Комментарии и докстринги в проекте на русском — кириллица в них не «неоднозначный символ».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
