# Конфиг Eval-среза: что выгружать из полной локальной базы сверх вопросов Золотого набора.
# Сборка — `uv run python -m court_vision.eval_slice build` (см. README, «Eval-срез»).
#
# В срез сами попадают:
#   - сезоны, названные в вопросах Золотого набора (answers.yaml, поле question);
#   - статьи Wikipedia из expect_documents Золотого набора и rulebook целиком;
#   - последний сезон базы (include_latest_season).
# Сюда пишется только то, чего из набора не вывести.

seasons:
  # Последний сезон до введения трёхочковых (они появились в 1979-80): метрики, которой
  # тогда не было, в данных нет — null, не ноль.
  - 1978-79

include_latest_season: true
