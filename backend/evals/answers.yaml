# Золотой набор ответов: вопросы к прод-агенту и эталонные факты. Прогон —
# `uv run python -m court_vision.answer_eval` (см. README, «Eval ответов»).
#
# Числа в `reference` сняты с полной локальной базы (регулярный чемпионат, средние за игру,
# округление half-up — то же, что отдаёт get_player_stats). Эталон — факты, а не готовая
# формулировка: судья сверяет смысл. Каждый срез спринта добавляет сюда 3–6 вопросов под
# свой Инструмент (comparison, similar, reports).
#
# Поля: id, category, question, reference, expect_tools (подмножество, обязано быть
# вызвано), expect_sources (rulebook/wikipedia — Цитаты оттуда обязаны быть),
# must_not_refuse (по умолчанию true; false — когда честный ответ и есть «нельзя»).

# --- stats: сезонная статистика через get_player_stats ---
- id: stats-lebron-2012-13
  category: stats
  question: Сколько очков, подборов и передач за игру набирал Леброн Джеймс в сезоне 2012-13?
  reference:
    - "25.1 очка за игру"
    - "7.5 подбора за игру"
    - "6.8 передачи за игру"
  expect_tools: [get_player_stats]

- id: stats-curry-2015-16
  category: stats
  question: Какой процент трёхочковых и сколько трёшек за игру забивал Стеф Карри в 2015-16?
