# --- reports: create_scouting_report / search_reports, Скаутинг-отчёт сохраняется за пользователем ---
# Отчёты прогона принадлежат служебному пользователю eval-runner (answer_eval/runner.py), поэтому
# вопрос про «найди мой отчёт» сначала создаёт отчёт в том же вопросе, а вопрос про отсутствие
# отчёта берёт игрока, по которому отчёт не заказывается нигде в наборе. Числа сняты так же, как
# выше (get_player_stats / get_player_percentiles на полной базе, регулярный чемпионат).
- id: report-brunson-2023-24
  category: reports
  question: Сделай скаутинг-отчёт по Джейлену Брансону за сезон 2023-24.
  reference:
    - "отчёт создан и сохранён: ассистент сообщает об этом и даёт ссылку на страницу отчёта (карточка отчёта в чате)"
    - "Брансон 2023-24: 28.7 очка, 3.6 подбора, 6.7 передачи за игру в 77 играх; перцентиль очков 99, передач 95"
    - "слабые стороны по данным: потери (перцентиль 13 при инверсии — теряет много), блоки (13), подборы (37)"
    - "ассистент пересказывает суть отчёта коротко, числа берёт только из отчёта"
  expect_tools: [create_scouting_report]

- id: report-doncic-create-then-find
  category: reports
  question: Сделай отчёт по Луке Дончичу за 2023-24, а потом найди его среди моих отчётов.
  reference:
    - "отчёт создан, затем найден поиском среди собственных отчётов: оба шага названы в ответе, ссылка на отчёт есть"
    - "Дончич 2023-24: 33.9 очка (перцентиль 100), 9.2 подбора, 9.8 передачи за игру; потери 4.0 за игру — перцентиль 0"
    - "найденный отчёт — тот, что только что создан (игрок Luka Doncic, сезон 2023-24)"
  expect_tools: [create_scouting_report, search_reports]

- id: report-early-era-no-fingerprint
  category: reports
  question: Сделай скаутинг-отчёт по Уилту Чемберлену за сезон 1961-62.
  reference:
    - "отчёт создан: Чемберлен 1961-62 — 50.4 очка и 25.7 подбора за игру"
    - "у сезона нет Статистического отпечатка (до 1979-80 не считались перехваты, блоки, потери и трёхочковые), поэтому сопоставимых игроков в отчёте нет — ассистент не выдумывает «похожих»"
    - "перехваты, блоки и потери в отчёте не упоминаются как показатели: в ту эпоху не считались"
  expect_tools: [create_scouting_report]

- id: report-search-none
  category: reports
  question: Покажи мои отчёты по Биллу Расселлу.
  reference:
    - "у пользователя нет отчётов по Расселлу: ассистент говорит об этом прямо, не выдумывает содержимое и не выдаёт отчёт другого игрока за отчёт по Расселлу"
    - "предлагает создать отчёт по Расселлу"
  expect_tools: [search_reports]
  # Честный ответ и есть «отчёта нет» — шаблон отказа в нём законен.
  must_not_refuse: false
