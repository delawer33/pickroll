# --- rules: правила по rulebook с цитатами ---
- id: rules-shot-clock-reset
  category: rules
  question: На сколько секунд сбрасывается таймер атаки, если нападающие первыми получили мяч после неудачного штрафного, оставшегося в игре?
  reference:
    - "таймер атаки сбрасывается на 14 секунд (Rule 7, Sec. IV)"
  expect_tools: [search_corpus]
  expect_sources: [rulebook]

- id: rules-six-fouls
  category: rules
  question: После какого по счёту персонального фола игрока удаляют из матча?
  reference:
    - "игрок дисквалифицируется после шестого персонального фола (Rule 3)"
  expect_tools: [search_corpus]
  expect_sources: [rulebook]

- id: rules-offensive-three-seconds
  category: rules
  question: Сколько секунд игрок нападения может находиться в краске, пока его команда владеет мячом?
  reference:
    - "не более трёх секунд (правило трёх секунд в нападении, Rule 10)"
  expect_tools: [search_corpus]
  expect_sources: [rulebook]

- id: rules-back-to-basket
  category: rules
  question: Сколько секунд можно вести мяч спиной к кольцу в передней зоне ниже линии штрафных?
  reference:
    - "не более пяти секунд"
    - "наказание — потеря мяча"
  expect_tools: [search_corpus]
  expect_sources: [rulebook]

- id: rules-goaltending
  category: rules
  question: Что такое голтендинг по правилам НБА?
  reference:
    - "нельзя касаться мяча на нисходящей траектории к кольцу выше уровня кольца или мяча, находящегося в корзине/на кольце"
  expect_tools: [search_corpus]
  expect_sources: [rulebook]

