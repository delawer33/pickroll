  category: similar
  question: Найди похожих на Дончича.
  reference:
    - "ближайшие по профилю сезоны: Леброн Джеймс 2018-19 (сходство 0.975), Джеймс Харден 2017-18 (0.969), Расселл Уэстбрук 2014-15 (0.955)"
